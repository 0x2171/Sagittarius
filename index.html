<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sagittarius</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-deep-dark: #000005;
    --bg-dark-blue: #020412;
    --bg-dark-purple: #050210;
    --bg-dark-indigo: #03030c;

    --figure:#ffffff;
    --stroke:#ffffff;
  }

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    color:#cbd5e1;
    display:grid; place-items:center;

    background:
      radial-gradient(1000px 700px at 20% 80%, rgba(5, 5, 20, 0.4), transparent 70%),
      radial-gradient(1200px 800px at 80% 20%, rgba(10, 5, 25, 0.3), transparent 65%),
      radial-gradient(800px 600px at 50% 10%, rgba(15, 5, 30, 0.2), transparent 75%),

      radial-gradient(800px 600px at 30% 20%, rgba(22, 74, 138, .08), transparent 70%),
      radial-gradient(900px 700px at 70% 70%, rgba(106, 27, 154, .06), transparent 65%),

      radial-gradient(1800px 1400px at 50% 50%, var(--bg-deep-dark), var(--bg-dark-blue) 85%),
      radial-gradient(1600px 1200px at 40% 60%, var(--bg-dark-indigo), var(--bg-dark-purple) 90%);
  }

  .stars, .stars::before, .stars::after{
    position: fixed;
    inset: 0;
    content: "";
    background-repeat: repeat;
    pointer-events: none;
  }
  .stars{
    background-image:
      radial-gradient(2px 2px at 10% 20%, #cfe3ff 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 30% 40%, #cfe3ff 50%, transparent 52%),
      radial-gradient(1.7px 1.7px at 60% 25%, #cfe3ff 50%, transparent 52%),
      radial-gradient(1.6px 1.6px at 80% 15%, #cfe3ff 50%, transparent 52%),
      radial-gradient(1.8px 1.8px at 75% 60%, #cfe3ff 50%, transparent 52%),
      radial-gradient(1.4px 1.4px at 15% 70%, #cfe3ff 50%, transparent 52%),
      radial-gradient(1.6px 1.6px at 48% 85%, #cfe3ff 50%, transparent 52%);
    animation: twinkle 4.5s ease-in-out infinite;
    opacity:.9;
  }
  .stars::before{
    background-image:
      radial-gradient(2.6px 2.6px at 20% 15%, #e9f3ff 50%, transparent 52%),
      radial-gradient(2.2px 2.2px at 55% 35%, #e9f3ff 50%, transparent 52%),
      radial-gradient(2.4px 2.4px at 88% 30%, #e9f3ff 50%, transparent 52%),
      radial-gradient(2.5px 2.5px at 35% 75%, #e9f3ff 50%, transparent 52%),
      radial-gradient(2.3px 2.3px at 70% 80%, #e9f3ff 50%, transparent 52%);
    animation: twinkle 3.8s ease-in-out infinite;
    animation-delay: .8s;
    opacity:.95;
  }
  .stars::after{
    background-image:
      radial-gradient(3.2px 3.2px at 12% 52%, #ffffff 50%, transparent 52%),
      radial-gradient(3px 3px at 44% 12%, #ffffff 50%, transparent 52%),
      radial-gradient(3.4px 3.4px at 76% 48%, #ffffff 50%, transparent 52%),
      radial-gradient(3px 3px at 90% 72%, #ffffff 50%, transparent 52%);
    animation: twinkle 5.2s ease-in-out infinite;
    animation-delay: 1.5s;
    opacity:1;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.5; transform:translateY(0) }
    50%    { opacity:1;  transform:translateY(-.6px) }
  }

  .title {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Great Vibes", cursive;
    font-size: clamp(42px, 7vw, 96px);
    line-height: 1;
    letter-spacing: .02em;
    color: #fff;
    text-shadow:
      0 0 8px rgba(255,255,255,.65),
      0 0 24px rgba(140,180,255,.45),
      0 0 48px rgba(120,70,255,.35);
    user-select: none;
    white-space: nowrap;
    z-index: 10;
  }

  svg .glow{
    filter: drop-shadow(0 0 12px rgba(255,255,255,.35))
            drop-shadow(0 0 28px rgba(120,180,255,.25));
  }

  @keyframes sway {
    from { transform: rotate(-1.5deg); }
    to   { transform: rotate(1.5deg); }
  }
  .glyph {
    transform-origin: 300px 300px;
    animation: sway 6s ease-in-out infinite alternate;
  }

  @keyframes draw {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-10px, 10px); }
  }
  .arrow {
    animation: draw 2.6s ease-in-out infinite;
  }

  @keyframes ringPulse {
    0%, 100% { opacity: .9; }
    50%      { opacity: .55; }
  }
  .ring-outer { animation: ringPulse 5s ease-in-out infinite; }
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>
<div class="title" aria-hidden="true">Sagittarius|Стрелец</div>

<svg viewBox="0 0 600 600" width="82%" aria-label="Символ Стрельца: натянутый лук со стрелой в круге">
  <defs>
    <radialGradient id="neb" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="rgba(60, 60, 130, .14)"/>
      <stop offset="60%" stop-color="rgba(90, 50, 130, .09)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <circle cx="300" cy="300" r="280" fill="url(#neb)" opacity=".35"/>

  <g class="glyph glow" fill="none" stroke="var(--stroke)" stroke-linecap="round" stroke-linejoin="round">

    <circle class="ring-outer" cx="300" cy="300" r="272" stroke-width="6"/>
    <circle cx="300" cy="300" r="258" stroke-width="1.5" opacity=".35"/>

    <path d="M 170 100
             A 380 380 0 0 1 500 460
             A 520 520 0 0 0 170 100 Z"
          stroke-width="5"/>

    <path d="M 170 100 L 168 448 L 500 460" stroke-width="3" opacity=".9"/>

    <g class="arrow">
      <path d="M 152 464 L 430 184" stroke-width="5"/>

      <path d="M 461 154 L 409 163 Q 430 184 452 206 Z" stroke-width="5"/>

      <path d="M 186 402 L 207 381 L 221 395 L 200 416 Z" stroke-width="4"/>
      <path d="M 200 416 L 221 395 L 235 409 L 214 430 Z" stroke-width="4"/>
    </g>

  </g>

  <g opacity="0.95">
    <circle cx="70" cy="120" r="1.6" fill="#cfe3ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" begin=".2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="90" r="1.5" fill="#cfe3ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="555" cy="300" r="1.4" fill="#cfe3ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="520" r="1.6" fill="#cfe3ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.4s" begin=".5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="560" r="1.3" fill="#cfe3ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="470" r="1.5" fill="#cfe3ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="300" r="1.3" fill="#cfe3ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.8s" begin=".3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="45" r="1.4" fill="#cfe3ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" begin=".6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

</body>
</html>
